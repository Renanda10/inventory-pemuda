const PAL=['#0B7A75','#F59E0B','#3B82C4','#D64545','#7C5CBF','#2E9E6B','#E0709A','#8A9A9C'],SCOL={tersedia:'#2E9E6B',dipinjam:'#3B82C4',rusak:'#D64545',perbaikan:'#F59E0B',hilang:'#8A9A9C'};let dm='kon';
const donut=()=>{const k=dm=='kat',m=k?db.categories.map((c,i)=>[c.nama,db.items.filter(x=>x.category_id==c.id&&x.status=='tersedia').length,PAL[i%8]]):Object.keys(SCOL).map(x=>[x[0].toUpperCase()+x.slice(1),cnt(x),SCOL[x]]),tot=m.reduce((a,x)=>a+x[1],0);let o=0;
return `<div class="c"><div class="chips"><button class="${k?'':'on'}" onclick="dm='kon';draw()">Per kondisi</button><button class="${k?'on':''}" onclick="dm='kat';draw()">Tersedia per kategori</button></div>${db.items.length?`<div class="dn"><svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--ln)" stroke-width="6"/>${tot?m.filter(x=>x[1]).map(x=>{const p=x[1]/tot*100,a=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${x[2]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-o}"/>`;o+=p;return a}).join(''):''}<text x="21" y="20.5" text-anchor="middle" style="fill:var(--tx);font:700 8px sans-serif">${tot}</text><text x="21" y="26" text-anchor="middle" style="fill:var(--mu);font:3.2px sans-serif">${k?'tersedia':'unit'}</text></svg><div class="lgd">${m.map(x=>`<div><i style="background:${x[2]}"></i>${esc(x[0])}<b>${x[1]}</b></div>`).join('')}</div></div>`:'<p class="mu">Belum ada barang. Tambahkan lewat tab Barang.</p>'}</div>`};
const V={
home(){const L=db.loans.filter(late);return `<div class="gr">${[['Total barang',db.items.length],['Tersedia',cnt('tersedia'),'ok'],['Dipinjam',cnt('dipinjam'),'bl'],['Rusak, perbaikan, hilang',cnt('rusak')+cnt('perbaikan')+cnt('hilang'),'wr']].map(([a,b,c])=>`<div class="c st ${c||''}"><span>${a}</span><b>${b}</b></div>`).join('')}</div><h2>Ringkasan stok</h2>${donut()}<h2>Terlambat dikembalikan</h2>${L.map(loanCard).join('')||'<p class="mu">Tidak ada peminjaman terlambat.</p>'}<h2>Peminjaman terbaru</h2>${db.loans.slice(-5).reverse().map(loanCard).join('')||'<p class="mu">Belum ada peminjaman. Buka tab Pinjam untuk mencatat yang pertama.</p>'}`},
items(){return `<div class="bar"><input placeholder="Cari kode atau nama" oninput="qs=this.value;drawItems()" value="${esc(qs)}"><select onchange="fs=this.value;drawItems()">${['','tersedia','dipinjam','rusak','perbaikan','hilang'].map(s=>`<option value="${s}" ${s==fs?'selected':''}>${s||'Semua status'}</option>`).join('')}</select></div>${me.role=='administrator'?'<button class="p" onclick="itemM()">Tambah barang</button>':''}<div id="list" style="margin-top:12px"></div>`},
pinjam(){return `<div class="c"><label>Peminjam<select id="pb" onchange="$('#nb').hidden=this.value!='new'">${db.borrowers.map(b=>`<option value="${b.id}">${esc(b.nama)}</option>`).join('')}<option value="new">+ Peminjam baru</option></select></label><div id="nb" ${db.borrowers.length?'hidden':''}><label>Nama<input id="bn"></label><label>No HP<input id="bh" inputmode="tel"></label><label>Alamat atau RT<input id="ba"></label></div><div class="two"><label>Tanggal pinjam<input type="date" id="d1" value="${today()}"></label><label>Rencana kembali<input type="date" id="d2" value="${addD(today(),3)}"></label></div></div><h2>Pilih barang tersedia</h2><input placeholder="Cari barang" oninput="pq=this.value;drawPick()" value="${esc(pq)}" style="margin-bottom:10px"><div id="pick"></div><p class="ee" id="e"></p><button class="p" onclick="loanS()">Simpan peminjaman</button>`},
riwayat(){const f=l=>!rf||(rf=='terlambat'?late(l):l.status==rf);return `<div class="chips">${[['','Semua'],['dipinjam','Dipinjam'],['terlambat','Terlambat'],['selesai','Selesai']].map(([k,l])=>`<button class="${k==rf?'on':''}" onclick="rf='${k}';draw()">${l}</button>`).join('')}</div>${db.loans.filter(f).reverse().map(loanCard).join('')||'<p class="mu">Tidak ada data.</p>'}`},
laporan(){return lt=='pinjam'?lapP():V.laporanB().replace('<div class="no-print">','<div class="no-print">'+swc())},
laporanB(){const bad=db.items.filter(i=>['rusak','perbaikan','hilang'].includes(i.status)),n=bad.length,tgl=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}),m={};
db.items.forEach(i=>{const k=i.nama.trim().toLowerCase(),g=m[k]=m[k]||{nama:i.nama.trim(),t:0,tersedia:0,dipinjam:0,rusak:0,perbaikan:0,hilang:0};g.t++;g[i.status]++});
const L=(lf?bad:db.items.slice()).sort((a,b)=>a.kode.localeCompare(b.kode));
return `<div class="no-print"><div class="chips"><button class="${lf?'':'on'}" onclick="lf='';draw()">Semua barang</button><button class="${lf?'on':''}" onclick="lf='bad';draw()">Bermasalah</button></div><button class="p" onclick="cetak()">Cetak laporan</button></div><div class="rep"><h2>Laporan Kondisi Inventaris</h2><p class="mu">Karang Taruna Arjuna 01/04, per ${tgl}. Dicetak oleh ${esc(me.nama)}.</p><div class="c ${n?'bad':'good'}"><b>${n?`Ada ${n} barang rusak, perbaikan, atau hilang`:'Tidak ada barang rusak, perbaikan, atau hilang'}</b></div><h2>Ringkasan per jenis</h2>${db.items.length?`<div class="tw"><table><tr><th>Jenis</th><th>Total</th><th>Tersedia</th><th>Dipinjam</th><th>Rusak</th><th>Perbaikan</th><th>Hilang</th></tr>${Object.values(m).sort((a,b)=>a.nama.localeCompare(b.nama)).map(g=>`<tr><td>${esc(g.nama)}</td><td>${g.t}</td><td>${g.tersedia}</td><td>${g.dipinjam}</td><td class="${g.rusak?'x':''}">${g.rusak}</td><td class="${g.perbaikan?'x':''}">${g.perbaikan}</td><td class="${g.hilang?'x':''}">${g.hilang}</td></tr>`).join('')}</table></div>`:'<p class="mu">Belum ada barang.</p>'}<h2>${lf?'Daftar barang bermasalah':'Daftar semua barang'}</h2>${L.length?`<div class="tw"><table><tr><th>Kode</th><th>Nama</th><th>Kategori</th><th>Kondisi</th><th>Status</th></tr>${L.map(i=>`<tr><td>${esc(i.kode)}</td><td>${esc(i.nama)}</td><td>${esc(cat(i.category_id)?.nama)}</td><td>${i.kondisi=='baik'?'normal':i.kondisi}</td><td>${i.status}</td></tr>`).join('')}</table></div>`:'<p class="mu">Tidak ada barang pada daftar ini.</p>'}<div class="sign"><p>Mengetahui,</p><br><br><p>(................................)</p></div></div>`},
kelola(){const bt=(f,id,d)=>`<button class="g" onclick="${f}(${id})">Ubah</button>${d?`<button class="g" onclick="del('${d}',${id})">Hapus</button>`:''}`;return `<h2>Kategori</h2><div class="bar"><input id="nc" placeholder="Nama kategori"><button class="p" onclick="catS()">Tambah</button></div>${db.categories.map(c=>`<div class="c r"><b>${esc(c.nama)}</b><div>${bt('catE',c.id,'deleteCategory')}</div></div>`).join('')||'<p class="mu">Belum ada kategori.</p>'}<h2>Peminjam</h2>${db.borrowers.map(b=>`<div class="c r"><div><b>${esc(b.nama)}</b><p class="mu">${esc(b.hp)} ${esc(b.alamat)}</p></div><div>${bt('borE',b.id,'deleteBorrower')}</div></div>`).join('')||'<p class="mu">Belum ada peminjam.</p>'}<h2>Akun</h2>${db.users.map(u=>`<div class="c r"><div><b>${esc(u.nama)}</b><p class="mu">${esc(u.username)}, ${u.role}${u.aktif?'':', nonaktif'}</p></div><div>${u.role=='admin'?`<button class="g" onclick="act(${u.id})">${u.aktif?'Nonaktifkan':'Aktifkan'}</button>`:''}${bt('userE',u.id,u.role=='admin'?'deleteUser':'')}</div></div>`).join('')}<div class="c"><label>Nama<input id="un"></label><label>Username<input id="uu" autocapitalize="none"></label><label>Password (minimal 6 karakter)<input id="up" type="password"></label><p class="ee" id="e"></p><button class="p" onclick="userS()">Tambah admin</button></div>`}};
const IC={home:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',items:'M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',pinjam:'M12 5v14M5 12h14',riwayat:'M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2',laporan:'M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7',kelola:'M4 6h16M4 12h16M4 18h16'};
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[k]}"/></svg>`;
function draw(){
if(!me){$('#app').innerHTML=`<div class="lh"><div class="logo" style="color:#fff">${svg('items')}</div><h1>Karang Taruna<br>Arjuna 01/04</h1><p>Inventaris dan peminjaman barang</p></div><div class="lc"><div class="c"><label>Username<input id="lu" autocapitalize="none" autocomplete="username" placeholder="Masukkan username"></label><label>Password<input id="lp" type="password" autocomplete="current-password" placeholder="Masukkan password" onkeydown="if(event.key=='Enter')login()"></label><button class="g" style="margin:-4px 0 6px" onclick="tp()">Tampilkan password</button><p class="ee" id="e"></p><button class="p" onclick="login()">Masuk</button></div><p class="mu" style="text-align:center">${API()?'Terhubung ke server':'Mode demo di perangkat'}</p><div style="text-align:center"><button class="g" onclick="srvM()">Pengaturan server</button></div></div>`;return}
const tabs=[['home','Beranda'],['items','Barang'],['pinjam','Pinjam'],['riwayat','Riwayat'],['laporan','Laporan']];if(me.role=='administrator')tabs.push(['kelola','Kelola']);
$('#app').innerHTML=`<header><div><small>Halo, ${esc(me.nama)} (${me.role})</small><b>Karang Taruna Arjuna 01/04</b></div><button class="g" onclick="me=null;tok='';tab='home';draw()">Keluar</button></header><main>${V[tab]()}</main><nav>${tabs.map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${svg(k)}<span>${l}</span></button>`).join('')}</nav>`;
if(tab=='items')drawItems();if(tab=='pinjam')drawPick()}
function cetak(){if(window.AndroidPrint)AndroidPrint.print();else window.print()}
function go(t){tab=t;draw();scrollTo(0,0);if(API()&&me)run('getAll',{},()=>{if(!$('#m').innerHTML&&tab!='pinjam'&&tab!='kelola')draw()})}
function tp(){const x=$('#lp');x.type=x.type=='password'?'text':'password'}
function login(){run('login',{u:$('#lu').value,p:$('#lp').value},r=>{me=r.user;tab='home';draw()})}
function srvM(){modal(`<h2>Server Google Sheets</h2><p class="mu">Tempel alamat Web App dari Apps Script. Kosongkan untuk mode demo (data hanya di perangkat ini).</p><label>Alamat API<input id="su" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(API())}" autocapitalize="none"></label><button class="p" onclick="srvS()">Simpan</button>`)}
function srvS(){const v=$('#su').value.trim();if(v&&!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v))return toast('Alamat harus berakhiran /exec');try{v?localStorage.setItem('ikt_api',v):localStorage.removeItem('ikt_api')}catch(e){}closeM();draw();toast(v?'Server disimpan':'Mode demo aktif')}
function drawItems(){const q=qs.toLowerCase(),a=db.items.filter(i=>(!fs||i.status==fs)&&(i.kode+i.nama).toLowerCase().includes(q));$('#list').innerHTML=a.map(i=>`<div class="c r"><div><b>${esc(i.kode)}</b><p class="mu">${esc(i.nama)}, ${esc(cat(i.category_id)?.nama)}</p></div><div class="rt">${tag(i.status)}<div>${i.status!='dipinjam'?`<button class="g" onclick="kondE(${i.id})">Kondisi</button>`:''}${me.role=='administrator'?`<button class="g" onclick="itemE(${i.id})">Ubah</button><button class="g" onclick="del('deleteItem',${i.id})">Hapus</button>`:''}</div></div></div>`).join('')||'<p class="mu">Barang tidak ditemukan.</p>'}

function itemM(){modal(`<h2>Tambah barang</h2><label>Nama barang<input id="f2" placeholder="Contoh: Lampu"></label><label>Jumlah unit<input id="f1" type="number" min="1" max="100" value="1" inputmode="numeric"></label><p class="mu">Kode dibuat otomatis, misalnya LAMP-01, LAMP-02.</p><label>Kategori<select id="f3">${db.categories.map(c=>`<option value="${c.id}">${esc(c.nama)}</option>`).join('')}</select></label><p class="ee" id="e"></p><button class="p" onclick="itemS()">Simpan barang</button>`)}

let pp={},rp={},nt={},lt='barang',ld1='',ld2='';

function drawPick(){const q=pq.toLowerCase(),a=db.items.filter(i=>i.status=='tersedia'&&(i.kode+i.nama).toLowerCase().includes(q));$('#pick').innerHTML=a.map(i=>`<div class="c ${sel.has(i.id)?'sel':''}" onclick="tg(${i.id})" style="cursor:pointer"><div class="r"><div><b>${esc(i.kode)}</b> <span class="mu">${esc(i.nama)}</span></div>${sel.has(i.id)?tag('dipilih','ok'):''}</div>${sel.has(i.id)?`<input placeholder="Catatan kondisi barang (opsional)" value="${esc(nt[i.id]||'')}" oninput="nt[${i.id}]=this.value" onclick="event.stopPropagation()" style="margin-top:8px"><input type="file" accept="image/*" capture="environment" onchange="pickPh(${i.id},this)" onclick="event.stopPropagation()" style="margin-top:8px">${pp[i.id]?`<img class="pv" src="${pp[i.id]}">`:''}`:''}</div>`).join('')||'<p class="mu">Tidak ada barang tersedia.</p>'}
function lapP(){const L=db.loans.filter(l=>(!ld1||l.pinjam>=ld1)&&(!ld2||l.pinjam<=ld2)).sort((a,b)=>b.pinjam.localeCompare(a.pinjam)),gu=L.reduce((s,l)=>s+l.d.reduce((t,x)=>t+(x.gt=='uang'?Number(x.gu)||0:0),0),0);

function tg(id){sel.has(id)?sel.delete(id):sel.add(id);drawPick()}
function loanS(){const b=$('#pb').value;run('createLoan',{b:b=='new'?0:+b,nb:b=='new'?{nama:$('#bn').value,hp:$('#bh').value,alamat:$('#ba').value}:null,d1:$('#d1').value,d2:$('#d2').value,ids:[...sel],cats:nt,fotos:Object.fromEntries([...sel].filter(i=>pp[i]).map(i=>[i,pp[i]]))},()=>{sel.clear();nt={};pp={};pq='';tab='riwayat';draw();toast('Peminjaman disimpan')})}
function retM(id){rp={};const l=db.loans.find(x=>x.id==id);modal(`<h2>Pengembalian</h2><p class="mu">${esc(bn(l.bid).nama)}</p>${l.d.map(x=>{const i=it(x.iid);return `<div class="c"><b>${esc(i.kode)}, ${esc(i.nama)}</b><p class="mu">Saat dipinjam: ${esc(x.cat||'-')}</p><label>Kondisi sekarang<select data-i="${i.id}" onchange="rg(this)"><option value="baik">Baik</option><option value="rusak">Rusak</option><option value="hilang">Hilang</option></select></label><label>Catatan kondisi saat kembali<input data-c="${i.id}"></label><label>Foto kondisi saat kembali<input type="file" accept="image/*" capture="environment" onchange="retPh(${i.id},this)"></label><img id="pv${i.id}" class="pv" hidden><div id="g${i.id}" hidden><label>Ganti rugi<select data-t="${i.id}" onchange="rg(this)"><option value="">Belum ada</option><option value="barang">Barang pengganti</option><option value="uang">Uang</option></select></label><div id="gb${i.id}" hidden><label>Nama barang pengganti<input data-n="${i.id}" value="${esc(i.nama)}"></label><label>Jumlah<input data-q="${i.id}" type="number" min="1" value="1"></label></div><div id="gu${i.id}" hidden><label>Nominal uang (Rp)<input data-u="${i.id}" type="number" inputmode="numeric"></label></div></div></div>`}).join('')}<p class="ee" id="e"></p><button class="p" onclick="retS(${id})">Simpan pengembalian</button>`)}
function rg(e){const i=e.dataset.i||e.dataset.t,k=$(`[data-i="${i}"]`).value,t=$(`[data-t="${i}"]`).value;$('#g'+i).hidden=k=='baik';$('#gb'+i).hidden=k=='baik'||t!='barang';$('#gu'+i).hidden=k=='baik'||t!='uang'}
function retS(id){const rs={};document.querySelectorAll('[data-i]').forEach(s=>{const i=s.dataset.i,v=a=>$(`[data-${a}="${i}"]`).value;rs[i]={k:s.value,c:v('c'),t:v('t'),n:v('n'),q:v('q'),u:v('u'),f:rp[i]||''}});run('returnLoan',{id,rs},()=>{rp={};closeM();draw();toast('Pengembalian dicatat')})}
function ph(f,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6))};im.src=r.result};r.readAsDataURL(f)}
function pickPh(id,e){const f=e.files[0];if(f)ph(f,d=>{pp[id]=d;drawPick()})}
function retPh(id,e){const f=e.files[0];if(f)ph(f,d=>{rp[id]=d;const v=$('#pv'+id);v.src=d;v.hidden=false})}
function zoom(u){modal(`<img src="${u}" style="width:100%;border-radius:12px"><button class="p" onclick="closeM()">Tutup</button>`)}
const FM={};
function fm(t,F,a,base){FM.a=a;FM.b=base;modal(`<h2>${t}</h2>${F.map(([k,l,v,ty,o])=>`<label>${l}${o?`<select data-k="${k}">${o.map(([x,y])=>`<option value="${x}" ${x==v?'selected':''}>${esc(y)}</option>`).join('')}</select>`:`<input data-k="${k}" type="${ty||'text'}" value="${esc(v)}">`}</label>`).join('')}<p class="ee" id="e"></p><button class="p" onclick="fmS()">Simpan perubahan</button>`)}
function fmS(){const o={...FM.b};document.querySelectorAll('[data-k]').forEach(x=>o[x.dataset.k]=x.value);run(FM.a,o,()=>{closeM();draw();toast('Perubahan disimpan')})}
const del=(a,id)=>{if(confirm('Hapus data ini? Tindakan tidak bisa dibatalkan.'))run(a,{id},()=>{draw();toast('Data dihapus')})};
function itemE(id){const i=it(id);fm('Ubah barang '+i.kode,[['n','Nama barang',i.nama],['c','Kategori',i.category_id,0,db.categories.map(c=>[c.id,c.nama])]],'editItem',{id})}
function kondE(id){const i=it(id);fm('Kondisi '+i.kode,[['k','Kondisi barang',i.status=='tersedia'?'normal':i.status,0,['normal','rusak','perbaikan','hilang'].map(x=>[x,x[0].toUpperCase()+x.slice(1)])]],'setKondisi',{id})}
function catE(id){fm('Ubah kategori',[['n','Nama kategori',cat(id).nama]],'editCategory',{id})}
function borE(id){const b=bn(id);fm('Ubah peminjam',[['n','Nama',b.nama],['h','No HP',b.hp],['a','Alamat atau RT',b.alamat]],'editBorrower',{id})}
function userE(id){const u=db.users.find(x=>x.id==id);fm('Ubah akun',[['n','Nama',u.nama],['u','Username',u.username],['p','Password baru (kosongkan jika tidak diganti)','','password']],'editUser',{id})}
function loanE(id){const l=db.loans.find(x=>x.id==id);fm('Ubah peminjaman',[['r','Rencana kembali',l.rencana,'date'],...l.d.map(x=>['c_'+x.iid,'Catatan kondisi '+it(x.iid).kode,x.cat||''])],'editLoan',{id})}
function catS(){run('addCategory',{n:$('#nc').value},()=>draw())}
function act(id){run('toggleUser',{id},()=>draw())}
function userS(){run('addUser',{n:$('#un').value,u:$('#uu').value,p:$('#up').value},()=>{draw();toast('Admin ditambahkan')})}
draw();
</script></body></html>
