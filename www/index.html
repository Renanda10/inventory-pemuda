<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventaris Karang Taruna</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F5F4;--sf:#fff;--tx:#10292B;--mu:#5C7072;--ln:#DCE6E4;--pr:#0B7A75;--pt:#fff;--g1:#0A3A42;--g2:#0B7A75;--ok:#12794A;--okb:#DAF3E5;--wr:#8A4F05;--wrb:#FDEBC8;--er:#B3261E;--erb:#FADCD9;--bl:#1D5C96;--blb:#DBEAF8;--sh:0 1px 2px rgba(16,41,43,.06),0 10px 28px rgba(16,41,43,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1617;--sf:#142426;--tx:#E4F0EE;--mu:#9CB3B1;--ln:#254142;--pr:#3FC1B6;--pt:#062321;--g1:#0A2A30;--g2:#0E6A66;--ok:#6FD39A;--okb:#17382A;--wr:#F0B35A;--wrb:#3D2C0E;--er:#F59A93;--erb:#40201D;--bl:#8BBEEF;--blb:#17314A;--sh:none}}
:root[data-theme="dark"]{--bg:#0C1617;--sf:#142426;--tx:#E4F0EE;--mu:#9CB3B1;--ln:#254142;--pr:#3FC1B6;--pt:#062321;--g1:#0A2A30;--g2:#0E6A66;--ok:#6FD39A;--okb:#17382A;--wr:#F0B35A;--wrb:#3D2C0E;--er:#F59A93;--erb:#40201D;--bl:#8BBEEF;--blb:#17314A;--sh:none}
*{box-sizing:border-box}[hidden]{display:none!important}
html{background:var(--g1);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;padding-bottom:104px;-webkit-tap-highlight-color:transparent}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 18px 30px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:0 0 26px 26px}
header b{display:block;font-size:19px;letter-spacing:-.3px}header small{display:block;opacity:.8;font-size:12px}header .g{color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:99px}
main,.lg{max-width:560px;margin:0 auto;padding:16px}main{margin-top:-14px}
.lg{padding-top:56px;text-align:center}.lg .c{text-align:left}
.logo{width:78px;height:78px;margin:0 auto 16px;border-radius:26px;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;box-shadow:0 12px 28px rgba(11,122,117,.35)}.logo svg{width:38px;height:38px}
h1{font-size:29px;line-height:1.12;margin:0 0 8px;letter-spacing:-.6px}h2{font-size:15px;margin:22px 0 10px}
.c{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--sh)}.c.sel{outline:2px solid var(--pr)}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}.rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.mu{color:var(--mu);margin:2px 0;font-size:13px}.ee{color:var(--er);margin:6px 0;font-size:13px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{margin:0;position:relative;overflow:hidden;padding-top:18px;display:flex;flex-direction:column}.st::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--ln)}.st.ok::before{background:var(--ok)}.st.bl::before{background:var(--bl)}.st.wr::before{background:#F59E0B}
.st b{font-size:34px;line-height:1.1}.st span{color:var(--mu);font-size:13px}.st.ok b{color:var(--ok)}.st.bl b{color:var(--bl)}.st.wr b{color:var(--wr)}
.bar2{height:7px;border-radius:9px;background:var(--ln);margin:10px 0 2px;overflow:hidden}.bar2 i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ok),#4CC38A)}
.t{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap}
.t.ok{background:var(--okb);color:var(--ok)}.t.bl{background:var(--blb);color:var(--bl)}.t.wr{background:var(--wrb);color:var(--wr)}.t.er{background:var(--erb);color:var(--er)}
label{display:block;font-size:13px;font-weight:500;color:var(--mu);margin-bottom:12px}
input,select{display:block;width:100%;min-height:48px;margin-top:5px;padding:12px 14px;border:1.5px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
input:focus,select:focus{outline:none;border-color:var(--pr)}
button{font:inherit;cursor:pointer;min-height:44px;border-radius:12px;border:1px solid var(--ln);padding:10px 16px;background:var(--sf);color:var(--tx)}
button:active{transform:scale(.98)}button:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.p{background:linear-gradient(135deg,var(--g2),var(--g1));color:#fff;border:0;width:100%;font-weight:600;margin-top:6px;box-shadow:0 8px 20px rgba(11,122,117,.28)}
.g{background:none;font-size:13px;padding:6px 12px;min-height:36px}
.bar{display:flex;gap:8px;margin-bottom:10px}.bar input,.bar select{margin:0}.bar .p{width:auto;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.chips button{border-radius:99px;padding:8px 14px;min-height:38px}.chips .on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
nav{position:fixed;left:12px;right:12px;max-width:536px;margin:0 auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:6px;background:var(--sf);border:1px solid var(--ln);border-radius:22px;box-shadow:0 12px 32px rgba(16,41,43,.2)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mu);font-size:10.5px;font-weight:500;padding:7px 0;border-radius:16px;min-height:0}nav svg{width:21px;height:21px}nav .on{background:var(--pr);color:var(--pt)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:var(--sf);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;max-width:90%;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;z-index:6}
body.busy::before{content:"";position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:40%;background:#F59E0B;z-index:9;animation:bz 1s infinite ease-in-out}@keyframes bz{from{left:-40%}to{left:100%}}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px}th,td{border:1px solid var(--ln);padding:6px 8px;text-align:left}th{background:var(--bg)}td.x{color:var(--er);font-weight:700}
.good{border-color:var(--ok);color:var(--ok)}.bad{border-color:var(--er);color:var(--er)}.sign{display:none}
@media print{html{background:#fff}header,nav,.no-print,#ts,#m{display:none!important}body{background:#fff;color:#000;padding:0}main{max-width:none;padding:0;margin:0}.c{border:1px solid #000;color:#000;background:#fff;box-shadow:none}.mu{color:#333}th{background:#eee}th,td{border-color:#000;color:#000}td.x{color:#000;text-decoration:underline}.sign{display:block;margin-top:40px;text-align:right}:root{padding:0}}
</style></head><body>
<div id="app"></div><div id="m"></div><div id="ts" hidden></div>
<script>
const K='ikt_v3',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const fd=d=>d?new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-';
const nx=a=>Math.max(0,...a.map(x=>x.id))+1;
let db,me=null,tab='home',qs='',fs='',pq='',rf='',lf='',sel=new Set();
const bn=id=>db.borrowers.find(b=>b.id==id),it=id=>db.items.find(i=>i.id==id),cat=id=>db.categories.find(c=>c.id==id);
const cnt=s=>db.items.filter(i=>i.status===s).length;
const late=l=>l.status==='dipinjam'&&l.rencana<today();
const SC={tersedia:'ok',dipinjam:'bl',rusak:'wr',hilang:'er'};
const tag=(s,c)=>`<span class="t ${c||SC[s]}">${s}</span>`;
function seedDb(){return{users:[{id:1,nama:'Administrator',username:'admin',pass:H('admin1'),role:'administrator',aktif:true}],categories:[],items:[],borrowers:[],loans:[]}}
const strip=d=>({...d,users:d.users.map(({pass,...x})=>x)});
function handle(db,a,p,u){
const nx=t=>Math.max(0,...db[t].map(x=>x.id))+1,it=id=>db.items.find(i=>i.id==id),adm=()=>{if(u.role!='administrator')throw Error('Hanya Administrator yang boleh melakukan ini.')};
if(a=='login'){const x=db.users.find(x=>x.username==String(p.u||'').trim().toLowerCase()&&x.pass==H(p.p||''));if(!x)throw Error('Username atau password salah.');if(!x.aktif)throw Error('Akun nonaktif. Hubungi Administrator.');return x}
if(!u)throw Error('Sesi habis. Silakan masuk lagi.');
switch(a){
case'getAll':return;
case'addCategory':{adm();const n=String(p.n||'').trim();if(!n||db.categories.some(c=>c.nama.toLowerCase()==n.toLowerCase()))throw Error('Isi nama kategori yang belum ada.');db.categories.push({id:nx('categories'),nama:n});return}
case'addItems':{adm();const n=String(p.n||'').trim().replace(/\s+/g,' '),q=Math.floor(+p.q),c=+p.c;if(!db.categories.some(x=>x.id==c))throw Error('Buat kategori dulu di tab Kelola.');if(!n)throw Error('Isi nama barang.');if(!(q>=1&&q<=100))throw Error('Jumlah unit antara 1 dan 100.');
const ex=db.items.find(i=>i.nama.trim().toLowerCase()==n.toLowerCase()),nm=ex?ex.nama:n,pf=nm.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4)||'BRG';let k=db.items.filter(i=>i.kode.startsWith(pf+'-')).length;
for(let j=0;j<q;j++){let z;do{k++;z=pf+'-'+String(k).padStart(2,'0')}while(db.items.some(i=>i.kode==z));db.items.push({id:nx('items'),category_id:c,kode:z,nama:nm,kondisi:'baik',status:'tersedia'})}return}
case'fixItem':{adm();const i=it(p.id);if(!i)throw Error('Barang tidak ditemukan.');i.status='tersedia';i.kondisi='baik';return}
case'addUser':{adm();const n=String(p.n||'').trim(),x=String(p.u||'').trim().toLowerCase();if(!n||!x)throw Error('Isi nama dan username.');if(db.users.some(y=>y.username==x))throw Error('Username sudah dipakai.');if(String(p.p||'').length<6)throw Error('Password minimal 6 karakter.');db.users.push({id:nx('users'),nama:n,username:x,pass:H(p.p),role:'admin',aktif:true});return}
case'toggleUser':{adm();const x=db.users.find(y=>y.id==p.id&&y.role=='admin');if(!x)throw Error('Akun tidak ditemukan.');x.aktif=!x.aktif;return}
case'createLoan':{const ids=[...new Set((p.ids||[]).map(Number))];if(!ids.length)throw Error('Pilih minimal satu barang.');if(ids.some(i=>!it(i)||it(i).status!='tersedia'))throw Error('Ada barang yang sudah tidak tersedia.');if(!p.d1||!p.d2||p.d2<p.d1)throw Error('Tanggal rencana kembali tidak boleh sebelum tanggal pinjam.');
let b=+p.b;if(p.nb){const n=String(p.nb.nama||'').trim();if(!n)throw Error('Isi nama peminjam.');b=nx('borrowers');db.borrowers.push({id:b,nama:n,hp:p.nb.hp||'',alamat:p.nb.alamat||''})}else if(!db.borrowers.some(x=>x.id==b))throw Error('Pilih peminjam.');
ids.forEach(i=>it(i).status='dipinjam');db.loans.push({id:nx('loans'),bid:b,aid:u.id,pinjam:p.d1,rencana:p.d2,kembali:'',status:'dipinjam',d:ids.map(i=>({iid:i,k:''}))});return}
case'returnLoan':{const l=db.loans.find(x=>x.id==p.id&&x.status=='dipinjam');if(!l)throw Error('Peminjaman tidak aktif.');l.d.forEach(x=>{const k=(p.ks||{})[x.iid]||'baik',i=it(x.iid);x.k=k;i.status=k=='baik'?'tersedia':k;i.kondisi=k});l.kembali=today();l.status='selesai';return}
}throw Error('Aksi tidak dikenal.')}

const H=s=>s;
db={users:[],categories:[],items:[],borrowers:[],loans:[]};let tok='';
const DEF='https://script.google.com/macros/s/AKfycbzHljQcOzUX0TtJd7LTGlZLVaITRAmavc4jwIOyCiyl3PToDyOivg7EJwSP2IsZ8RYG0Q/exec';
const API=()=>{try{return localStorage.getItem('ikt_api')||DEF}catch(e){return DEF}};
async function call(a,p){const u=API();
if(!u){let d;try{d=JSON.parse(localStorage.getItem(K))}catch(e){}d=d||seedDb();const r=handle(d,a,p,me&&d.users.find(x=>x.id==me.id));try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}return{user:a=='login'?strip({users:[r]}).users[0]:null,db:strip(d)}}
const r=await(await fetch(u,{method:'POST',body:JSON.stringify({a,p,t:tok})})).json();if(!r.ok)throw Error(r.e);if(r.t)tok=r.t;return r}
const fail=m=>{const e=$('#e');e?e.textContent=m:toast(m)};
async function run(a,p,ok){document.body.classList.add('busy');try{const r=await call(a,p);if(r.db)db=r.db;if(ok)ok(r)}catch(e){fail(e instanceof SyntaxError?'Alamat API tidak valid.':e.message=='Failed to fetch'?'Tidak bisa terhubung ke server.':e.message)}document.body.classList.remove('busy')}
const modal=h=>{$('#m').innerHTML=`<div class="ov" onclick="if(event.target==this)closeM()"><div class="sheet">${h}</div></div>`},closeM=()=>{$('#m').innerHTML=''};
const toast=m=>{const t=$('#ts');t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,2000)},err=m=>{$('#e').textContent=m};
const loanCard=l=>{const b=bn(l.bid),lt=late(l);return `<div class="c"><div class="r"><b>${esc(b.nama)}</b>${lt?tag('terlambat','er'):tag(l.status,l.status=='dipinjam'?'bl':'ok')}</div><p class="mu">${l.d.map(x=>esc(it(x.iid).kode)).join(', ')}</p><p class="mu">Pinjam ${fd(l.pinjam)}, rencana kembali ${fd(l.rencana)}${l.kembali?`, kembali ${fd(l.kembali)}`:''}</p>${l.status=='dipinjam'?`<button class="p" onclick="retM(${l.id})">Proses pengembalian</button>`:''}</div>`};
const grp=()=>{const m={};db.items.forEach(i=>{const k=i.nama.trim().toLowerCase(),g=m[k]=m[k]||{nama:i.nama.trim(),t:0,ok:0,pj:0,bad:0};g.t++;if(i.status=='tersedia')g.ok++;else if(i.status=='dipinjam')g.pj++;else g.bad++});return Object.values(m).sort((a,b)=>a.nama.localeCompare(b.nama))};
const stokV=()=>grp().map(g=>`<div class="c"><div class="r"><b>${esc(g.nama)}</b><span class="mu">Total ${g.t}</span></div><div class="bar2"><i style="width:${g.t?Math.round(g.ok/g.t*100):0}%"></i></div><div class="r" style="margin-top:6px;justify-content:flex-start;flex-wrap:wrap">${tag(g.ok+' tersedia',g.ok?'ok':'er')}${g.pj?tag(g.pj+' dipinjam','bl'):''}${g.bad?tag(g.bad+' rusak atau hilang','wr'):''}</div></div>`).join('')||'<p class="mu">Belum ada barang. Tambahkan lewat tab Barang.</p>';
const V={
home(){const L=db.loans.filter(late);return `<div class="gr">${[['Total barang',db.items.length],['Tersedia',cnt('tersedia'),'ok'],['Dipinjam',cnt('dipinjam'),'bl'],['Rusak atau hilang',cnt('rusak')+cnt('hilang'),'wr']].map(([a,b,c])=>`<div class="c st ${c||''}"><span>${a}</span><b>${b}</b></div>`).join('')}</div><h2>Stok per jenis barang</h2>${stokV()}<h2>Terlambat dikembalikan</h2>${L.map(loanCard).join('')||'<p class="mu">Tidak ada peminjaman terlambat.</p>'}<h2>Peminjaman terbaru</h2>${db.loans.slice(-5).reverse().map(loanCard).join('')||'<p class="mu">Belum ada peminjaman. Buka tab Pinjam untuk mencatat yang pertama.</p>'}`},
items(){return `<div class="bar"><input placeholder="Cari kode atau nama" oninput="qs=this.value;drawItems()" value="${esc(qs)}"><select onchange="fs=this.value;drawItems()">${['','tersedia','dipinjam','rusak','hilang'].map(s=>`<option value="${s}" ${s==fs?'selected':''}>${s||'Semua status'}</option>`).join('')}</select></div>${me.role=='administrator'?'<button class="p" onclick="itemM()">Tambah barang</button>':''}<div id="list" style="margin-top:12px"></div>`},
pinjam(){return `<div class="c"><label>Peminjam<select id="pb" onchange="$('#nb').hidden=this.value!='new'">${db.borrowers.map(b=>`<option value="${b.id}">${esc(b.nama)}</option>`).join('')}<option value="new">+ Peminjam baru</option></select></label><div id="nb" ${db.borrowers.length?'hidden':''}><label>Nama<input id="bn"></label><label>No HP<input id="bh" inputmode="tel"></label><label>Alamat atau RT<input id="ba"></label></div><div class="two"><label>Tanggal pinjam<input type="date" id="d1" value="${today()}"></label><label>Rencana kembali<input type="date" id="d2" value="${addD(today(),3)}"></label></div></div><h2>Pilih barang tersedia</h2><input placeholder="Cari barang" oninput="pq=this.value;drawPick()" value="${esc(pq)}" style="margin-bottom:10px"><div id="pick"></div><p class="ee" id="e"></p><button class="p" onclick="loanS()">Simpan peminjaman</button>`},
riwayat(){const f=l=>!rf||(rf=='terlambat'?late(l):l.status==rf);return `<div class="chips">${[['','Semua'],['dipinjam','Dipinjam'],['terlambat','Terlambat'],['selesai','Selesai']].map(([k,l])=>`<button class="${k==rf?'on':''}" onclick="rf='${k}';draw()">${l}</button>`).join('')}</div>${db.loans.filter(f).reverse().map(loanCard).join('')||'<p class="mu">Tidak ada data.</p>'}`},
laporan(){const bad=db.items.filter(i=>i.status=='rusak'||i.status=='hilang'),n=bad.length,tgl=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}),m={};
db.items.forEach(i=>{const k=i.nama.trim().toLowerCase(),g=m[k]=m[k]||{nama:i.nama.trim(),t:0,tersedia:0,dipinjam:0,rusak:0,hilang:0};g.t++;g[i.status]++});
const L=(lf?bad:db.items.slice()).sort((a,b)=>a.kode.localeCompare(b.kode));
return `<div class="no-print"><div class="chips"><button class="${lf?'':'on'}" onclick="lf='';draw()">Semua barang</button><button class="${lf?'on':''}" onclick="lf='bad';draw()">Rusak atau hilang</button></div><button class="p" onclick="cetak()">Cetak laporan</button></div><div class="rep"><h2>Laporan Kondisi Inventaris</h2><p class="mu">Karang Taruna, per ${tgl}. Dicetak oleh ${esc(me.nama)}.</p><div class="c ${n?'bad':'good'}"><b>${n?`Ada ${n} barang rusak atau hilang`:'Tidak ada barang rusak atau hilang'}</b></div><h2>Ringkasan per jenis</h2>${db.items.length?`<div class="tw"><table><tr><th>Jenis</th><th>Total</th><th>Tersedia</th><th>Dipinjam</th><th>Rusak</th><th>Hilang</th></tr>${Object.values(m).sort((a,b)=>a.nama.localeCompare(b.nama)).map(g=>`<tr><td>${esc(g.nama)}</td><td>${g.t}</td><td>${g.tersedia}</td><td>${g.dipinjam}</td><td class="${g.rusak?'x':''}">${g.rusak}</td><td class="${g.hilang?'x':''}">${g.hilang}</td></tr>`).join('')}</table></div>`:'<p class="mu">Belum ada barang.</p>'}<h2>${lf?'Daftar barang rusak atau hilang':'Daftar semua barang'}</h2>${L.length?`<div class="tw"><table><tr><th>Kode</th><th>Nama</th><th>Kategori</th><th>Kondisi</th><th>Status</th></tr>${L.map(i=>`<tr><td>${esc(i.kode)}</td><td>${esc(i.nama)}</td><td>${esc(cat(i.category_id)?.nama)}</td><td>${i.kondisi}</td><td>${i.status}</td></tr>`).join('')}</table></div>`:'<p class="mu">Tidak ada barang pada daftar ini.</p>'}<div class="sign"><p>Mengetahui,</p><br><br><p>(................................)</p></div></div>`},
kelola(){return `<h2>Kategori</h2><div class="bar"><input id="nc" placeholder="Nama kategori"><button class="p" onclick="catS()">Tambah</button></div><p class="mu">${db.categories.map(c=>esc(c.nama)).join(', ')}</p><h2>Akun admin</h2>${db.users.map(u=>`<div class="c r"><div><b>${esc(u.nama)}</b><p class="mu">${esc(u.username)}, ${u.role}${u.aktif?'':', nonaktif'}</p></div>${u.role=='admin'?`<button class="g" onclick="act(${u.id})">${u.aktif?'Nonaktifkan':'Aktifkan'}</button>`:''}</div>`).join('')}<div class="c"><label>Nama<input id="un"></label><label>Username<input id="uu" autocapitalize="none"></label><label>Password (minimal 6 karakter)<input id="up" type="password"></label><p class="ee" id="e"></p><button class="p" onclick="userS()">Tambah admin</button></div>`}};
const IC={home:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',items:'M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',pinjam:'M12 5v14M5 12h14',riwayat:'M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2',laporan:'M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7',kelola:'M4 6h16M4 12h16M4 18h16'};
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[k]}"/></svg>`;
function draw(){
if(!me){$('#app').innerHTML=`<div class="lg"><div class="logo" style="color:#fff">${svg('items')}</div><h1>Inventaris<br>Karang Taruna</h1><p class="mu" style="margin-bottom:22px">Catat peminjaman, pantau stok, cetak laporan.</p><div class="c"><label>Username<input id="lu" autocapitalize="none" autocomplete="username"></label><label>Password<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"></label><p class="ee" id="e"></p><button class="p" onclick="login()">Masuk</button></div><button class="g" onclick="srvM()">${API()?'Server terhubung. Ubah':'Mode demo di perangkat. Hubungkan server'}</button></div>`;return}
const tabs=[['home','Beranda'],['items','Barang'],['pinjam','Pinjam'],['riwayat','Riwayat'],['laporan','Laporan']];if(me.role=='administrator')tabs.push(['kelola','Kelola']);
$('#app').innerHTML=`<header><div><small>Halo, ${esc(me.nama)} (${me.role})</small><b>Inventaris Karang Taruna</b></div><button class="g" onclick="me=null;tok='';tab='home';draw()">Keluar</button></header><main>${V[tab]()}</main><nav>${tabs.map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${svg(k)}<span>${l}</span></button>`).join('')}</nav>`;
if(tab=='items')drawItems();if(tab=='pinjam')drawPick()}
function cetak(){if(window.AndroidPrint)AndroidPrint.print();else window.print()}
function go(t){tab=t;draw();scrollTo(0,0);if(API()&&me)run('getAll',{},()=>{if(!$('#m').innerHTML&&tab!='pinjam'&&tab!='kelola')draw()})}
function login(){run('login',{u:$('#lu').value,p:$('#lp').value},r=>{me=r.user;tab='home';draw()})}
function srvM(){modal(`<h2>Server Google Sheets</h2><p class="mu">Tempel alamat Web App dari Apps Script. Kosongkan untuk mode demo (data hanya di perangkat ini).</p><label>Alamat API<input id="su" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(API())}" autocapitalize="none"></label><button class="p" onclick="srvS()">Simpan</button>`)}
function srvS(){const v=$('#su').value.trim();if(v&&!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v))return toast('Alamat harus berakhiran /exec');try{v?localStorage.setItem('ikt_api',v):localStorage.removeItem('ikt_api')}catch(e){}closeM();draw();toast(v?'Server disimpan':'Mode demo aktif')}
function drawItems(){const q=qs.toLowerCase(),a=db.items.filter(i=>(!fs||i.status==fs)&&(i.kode+i.nama).toLowerCase().includes(q));$('#list').innerHTML=a.map(i=>`<div class="c r"><div><b>${esc(i.kode)}</b><p class="mu">${esc(i.nama)}, ${esc(cat(i.category_id)?.nama)}</p></div><div class="rt">${tag(i.status)}${me.role=='administrator'&&(i.status=='rusak'||i.status=='hilang')?`<button class="g" onclick="fix(${i.id})">Pulihkan</button>`:''}</div></div>`).join('')||'<p class="mu">Barang tidak ditemukan.</p>'}
function fix(id){run('fixItem',{id},()=>{drawItems();toast('Barang tersedia lagi')})}
function itemM(){modal(`<h2>Tambah barang</h2><label>Nama barang<input id="f2" placeholder="Contoh: Lampu"></label><label>Jumlah unit<input id="f1" type="number" min="1" max="100" value="1" inputmode="numeric"></label><p class="mu">Kode dibuat otomatis, misalnya LAMP-01, LAMP-02.</p><label>Kategori<select id="f3">${db.categories.map(c=>`<option value="${c.id}">${esc(c.nama)}</option>`).join('')}</select></label><p class="ee" id="e"></p><button class="p" onclick="itemS()">Simpan barang</button>`)}
function itemS(){run('addItems',{n:$('#f2').value,q:$('#f1').value,c:$('#f3').value},()=>{closeM();draw();toast('Barang ditambahkan')})}
function drawPick(){const q=pq.toLowerCase(),a=db.items.filter(i=>i.status=='tersedia'&&(i.kode+i.nama).toLowerCase().includes(q));$('#pick').innerHTML=a.map(i=>`<div class="c r ${sel.has(i.id)?'sel':''}" onclick="tg(${i.id})" style="cursor:pointer"><div><b>${esc(i.kode)}</b> <span class="mu">${esc(i.nama)}</span></div>${sel.has(i.id)?tag('dipilih','ok'):''}</div>`).join('')||'<p class="mu">Tidak ada barang tersedia.</p>'}
function tg(id){sel.has(id)?sel.delete(id):sel.add(id);drawPick()}
function loanS(){const b=$('#pb').value;run('createLoan',{b:b=='new'?0:+b,nb:b=='new'?{nama:$('#bn').value,hp:$('#bh').value,alamat:$('#ba').value}:null,d1:$('#d1').value,d2:$('#d2').value,ids:[...sel]},()=>{sel.clear();pq='';tab='riwayat';draw();toast('Peminjaman disimpan')})}
function retM(id){const l=db.loans.find(x=>x.id==id);modal(`<h2>Pengembalian</h2><p class="mu">${esc(bn(l.bid).nama)}. Pilih kondisi tiap barang.</p>${l.d.map(x=>`<label>${esc(it(x.iid).kode)}, ${esc(it(x.iid).nama)}<select data-i="${x.iid}"><option value="baik">Baik</option><option value="rusak">Rusak</option><option value="hilang">Hilang</option></select></label>`).join('')}<button class="p" onclick="retS(${id})">Simpan pengembalian</button>`)}
function retS(id){const ks={};document.querySelectorAll('[data-i]').forEach(x=>ks[x.dataset.i]=x.value);run('returnLoan',{id,ks},()=>{closeM();draw();toast('Pengembalian dicatat')})}
function catS(){run('addCategory',{n:$('#nc').value},()=>draw())}
function act(id){run('toggleUser',{id},()=>draw())}
function userS(){run('addUser',{n:$('#un').value,u:$('#uu').value,p:$('#up').value},()=>{draw();toast('Admin ditambahkan')})}
draw();
</script></body></html>
